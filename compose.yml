name: ok-api-movie

services:
  app:
    build:
      context: .
      args:
        APP_UID: ${PUID:-1000}
        APP_GID: ${PGID:-1000}
    image: ok-api-movie:local
    container_name: ok-api-movie
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      PORT: 5000
      OKRU_CHROME_BINARY: /usr/bin/chromium
      OKRU_CHROMEDRIVER: /usr/bin/chromedriver
      OKRU_COOKIES_FILE: /data/okru_cookies.json
      OKRU_ARTIFACTS_DIR: /data/artifacts
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - "${APP_DATA_DIR:-./data}:/data"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
